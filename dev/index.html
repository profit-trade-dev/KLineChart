<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KLineChart Dev</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1b1b28;
      color: #e1e1e6;
    }
    #header {
      padding: 12px 20px;
      background: #252536;
      border-bottom: 1px solid #3a3a52;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    #header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #7b7bff;
    }
    #header span {
      font-size: 12px;
      color: #888;
    }
    #chart {
      width: 100%;
      height: calc(100vh - 48px);
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>KLineChart Dev</h1>
    <span>Hot-reload playground &mdash; edit src/ and see changes live</span>
  </div>
  <div id="chart"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
