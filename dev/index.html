<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KLineChart Dev</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1b1b28;
      color: #e1e1e6;
    }
    #header {
      padding: 12px 20px;
      background: #252536;
      border-bottom: 1px solid #3a3a52;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    #header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #7b7bff;
    }
    #header span {
      font-size: 12px;
      color: #888;
    }
    #symbol-search {
      position: relative;
      margin-left: auto;
    }
    #symbol-input {
      background: #1b1b28;
      border: 1px solid #3a3a52;
      color: #e1e1e6;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      width: 220px;
      outline: none;
    }
    #symbol-input:focus { border-color: #7b7bff; }
    #symbol-input::placeholder { color: #666; }
    #symbol-results {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #252536;
      border: 1px solid #3a3a52;
      border-top: none;
      border-radius: 0 0 4px 4px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 100;
    }
    .symbol-item {
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
    }
    .symbol-item:hover { background: #3a3a52; }
    .symbol-item .ticker { font-weight: 600; }
    .symbol-item .name { color: #888; font-size: 11px; }
    #period-select {
      background: #1b1b28;
      border: 1px solid #3a3a52;
      color: #e1e1e6;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    #chart {
      width: 100%;
      height: calc(100vh - 48px);
    }
  </style>
  <script src="./tradium-datafeed.js"></script>
</head>
<body>
  <div id="header">
    <h1>KLineChart Dev</h1>
    <span>Hot-reload playground &mdash; edit src/ and see changes live</span>
    <select id="period-select">
      <option value="1">1m</option>
      <option value="5">5m</option>
      <option value="15">15m</option>
      <option value="60">1h</option>
      <option value="240">4h</option>
      <option value="1D" selected>1D</option>
      <option value="1W">1W</option>
      <option value="1M">1M</option>
    </select>
    <div id="symbol-search">
      <input id="symbol-input" type="text" placeholder="Search symbol (e.g. AAPL)" autocomplete="off" />
      <div id="symbol-results"></div>
    </div>
  </div>
  <div id="chart"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
